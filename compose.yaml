services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/shipnow_demo
      LOG_LEVEL: info
      ENABLE_SWAGGER: "true"
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
      - log_data:/app/logs

volumes:
  mongodb_data:
  uploads_data:
  log_data:
